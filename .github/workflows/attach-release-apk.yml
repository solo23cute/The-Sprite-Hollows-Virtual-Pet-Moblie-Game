name: Attach release APK

on:
  workflow_dispatch:
  push:
    branches:
      - release-4.1.2.0-v73

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v4.1.2.0-v73" "SpriteHollow-4.1.2.0-v73-release.apk" --clobber
